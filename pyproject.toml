[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-logic-audit-lab"
version = "0.6.1"
description = "Explainable Japanese-equity screening, paper monitoring, performance analytics, stock research, and guarded adaptive learning."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AI Developer" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "requests>=2.32",
  "tabulate>=0.9",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0",
  "types-requests>=2.32",
]
jquants = ["jquants-api-client"]
ml = ["scikit-learn>=1.5,<2"]
quantlab = ["vectorbt>=1.1,<1.2"]

[project.scripts]
investment-audit = "investment_audit.cli:main"
investment-strategy-lab = "investment_audit.open_source_strategy_lab:main"
investment-adaptive-learning = "investment_audit.adaptive_learning:main"
investment-adaptive-strategy = "investment_audit.adaptive_strategy:main"
investment-adaptive-guard = "investment_audit.adaptive_guard:main"
investment-stock-details = "investment_audit.stock_detail_pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/investment_audit/feature_library.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disable_error_code = ["arg-type", "assignment", "index", "operator"]

[[tool.mypy.overrides]]
module = "investment_audit.providers.jquants"
disable_error_code = ["list-item"]

[[tool.mypy.overrides]]
module = "investment_audit.factor_diagnostics"
disable_error_code = ["call-overload"]
