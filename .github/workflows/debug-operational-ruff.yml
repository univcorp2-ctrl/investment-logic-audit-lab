name: Temporary operational learner Ruff diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ruff
        run: pip install ruff
      - name: Capture Ruff output
        shell: bash
        run: |
          set +e
          ruff check src tests --output-format concise > operational-ruff-output.txt 2>&1
          code=$?
          set -e
          echo "ruff_exit_code=$code" >> operational-ruff-output.txt
      - name: Commit unique diagnostic
        shell: bash
        run: |
          mkdir -p debug
          target="debug/operational-ruff-output-${GITHUB_RUN_ID}.txt"
          mv operational-ruff-output.txt "$target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "debug: operational Ruff output ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main
          git push origin main
