name: Weekly gated adaptive learning

on:
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gated-adaptive-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Focused tests
        run: pytest tests/test_adaptive_parameter_learner.py
      - name: Evaluate learned parameters
        run: python -m investment_audit.adaptive_parameter_learner --root . | tee adaptive-learning-result.json
      - name: Validate paper-only safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(Path('web/data/auto-learning/latest.json').read_text(encoding='utf-8'))
          active = json.loads(Path('web/data/auto-learning/active-parameters.json').read_text(encoding='utf-8'))
          assert latest['paper_only'] is True
          assert latest['real_order_allowed'] is False
          assert active['paper_only'] is True
          assert active['real_order_allowed'] is False
          if active['approved']:
              assert latest['gate_summary']['all_passed'] is True
              assert latest['confirmation']['current'] >= latest['confirmation']['required']
              assert active['mode'] == 'adaptive-paper'
              assert active['expires_at']
          text = json.dumps({'latest': latest, 'active': active}).lower()
          assert 'api_key' not in text and 'authorization' not in text
          PY
      - name: Commit learned paper parameters
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/auto-learning
          if git diff --cached --quiet; then
            echo 'No adaptive-learning changes.'
            exit 0
          fi
          git commit -m 'data: update gated adaptive paper parameters'
          git pull --rebase origin main
          git push origin main
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('web/data/auto-learning/latest.json')
          print('## Gated adaptive learning')
          if not path.exists():
              print('- No output')
              raise SystemExit
          data = json.loads(path.read_text(encoding='utf-8'))
          print(f"- Mode: {data['mode']}")
          print(f"- Candidate: {data['candidate']['strategy'] or 'none'}")
          print(f"- Operational observations: {data['observations']['operational']} / {data['observations']['required_operational']}")
          print(f"- OOS observations: {data['observations']['oos']} / {data['observations']['required_oos']}")
          print(f"- Gates: {data['gate_summary']['passed']} / {data['gate_summary']['total']}")
          print(f"- Confirmations: {data['confirmation']['current']} / {data['confirmation']['required']}")
          print(f"- Active paper strategy: {data['active']['strategy'] or 'baseline'}")
          print('- Real orders: disabled')
          PY
