name: Deprecated one-time J-Quants stock detail refresh

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo 'The one-time credential reader is retired.'
          echo 'Use weekly-stock-details.yml with the repository secret JQUANTS_API_KEY after rotating the credential.'
          echo 'No external credential source is read by this workflow.'
