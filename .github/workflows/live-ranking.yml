name: Update Live Ranking

on:
  workflow_dispatch:
  schedule:
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: live-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e .
      - name: Generate ranking
        run: python scripts/update_live_ranking.py
      - name: Commit refreshed data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "valuescope-bot"
          git config user.email "valuescope-bot@users.noreply.github.com"
          git add web/live-ranking.json web/live-ranking.csv
          if git diff --cached --quiet; then
            echo "No ranking changes"
            exit 0
          fi
          market_date=$(python -c 'import json; print(json.load(open("web/live-ranking.json"))["market_date"])')
          git commit -m "data: refresh live ranking ${market_date}"
          git push origin HEAD:main
