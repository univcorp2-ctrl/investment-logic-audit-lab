name: Temporary Python test diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Capture Python tests
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          set +e
          pytest --maxfail=20 -vv > python-test-output.txt 2>&1
          code=$?
          set -e
          echo "pytest_exit_code=$code" >> python-test-output.txt
      - name: Commit unique diagnostic output
        shell: bash
        run: |
          mkdir -p debug
          target="debug/python-test-output-${GITHUB_RUN_ID}.txt"
          mv python-test-output.txt "$target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "debug: Python test output ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main
          git push origin main
