name: Temporary web test diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and capture tests
        shell: bash
        run: |
          cd web
          npm ci
          set +e
          npm test > ../web-test-diagnostic.txt 2>&1
          code=$?
          set -e
          {
            echo
            echo "exit_code=$code"
          } >> ../web-test-diagnostic.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          mkdir -p debug
          mv web-test-diagnostic.txt debug/web-test-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/web-test-diagnostic.txt
          git commit -m 'debug: capture web test failure [skip ci]'
          git push
