name: Daily paper portfolio monitor

on:
  schedule:
    - cron: '15 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor only or update the paper ledger
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - simulate

permissions:
  contents: write

concurrency:
  group: daily-paper-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run focused tests
        run: pytest tests/test_daily_monitor.py tests/test_performance_analytics.py
      - name: Generate daily paper report
        id: monitor
        shell: bash
        run: |
          MODE_ARGS=()
          if [ '${{ github.event_name }}' = 'schedule' ] || [ '${{ inputs.mode }}' = 'simulate' ]; then
            MODE_ARGS+=(--execute-simulation)
          fi
          python -m investment_audit.daily_monitor --root . "${MODE_ARGS[@]}" | tee monitor-result.json
          python -m investment_audit.performance_analytics --root . | tee analytics-result.json
      - name: Validate sanitized output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('web/data/paper-trading/latest-report.json').read_text(encoding='utf-8'))
          assert report['paper_only'] is True
          assert report['summary']['equity'] >= 0
          assert 'performance_analytics' in report
          analytics = report['performance_analytics']
          assert analytics['risk_free_rate'] == 0
          assert analytics['groups']['trade_quality']['risk_reward_ratio']['value'] is None or isinstance(analytics['groups']['trade_quality']['risk_reward_ratio']['value'], (int, float))
          text = Path('web/data/paper-trading/latest-report.json').read_text(encoding='utf-8').lower()
          assert 'api_key' not in text and 'authorization' not in text
          PY
      - name: Commit changed reports
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/paper-trading
          if git diff --cached --quiet; then
            echo 'No report changes.'
            exit 0
          fi
          git commit -m 'data: update daily paper portfolio analytics'
          git pull --rebase origin main
          git push origin main
      - name: Write workflow summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('web/data/paper-trading/latest-report.json')
          if not path.exists():
              print('## Paper monitor\nNo report generated.')
              raise SystemExit
          report = json.loads(path.read_text(encoding='utf-8'))
          summary = report['summary']
          analytics = report.get('performance_analytics', {})
          proposals = [row for row in report['decisions'] if row['proposal']['side']]
          print('## Daily paper portfolio monitor')
          print(f"- Tokyo date: {report['trading_date']}")
          print(f"- Mode: {report['mode']}")
          print(f"- Paper proposals: {len(proposals)}")
          print(f"- Simulated events: {summary['executed_today']}")
          print(f"- Skipped: {len(report['skipped'])}")
          print(f"- Equity: ¥{summary['equity']:,.0f}")
          print(f"- Total P/L: ¥{summary['total_pnl']:,.0f}")
          print(f"- Return observations: {analytics.get('observation_count', 0)}")
          print(f"- Analytics status: {analytics.get('history_status', 'not_generated')}")
          print('- Real broker orders: never sent')
          PY
