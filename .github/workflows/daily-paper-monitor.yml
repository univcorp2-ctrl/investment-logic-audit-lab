name: Daily paper portfolio monitor

on:
  schedule:
    - cron: '15 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Monitor only or update the paper ledger
        required: true
        default: monitor
        type: choice
        options:
          - monitor
          - simulate

permissions:
  contents: write

concurrency:
  group: daily-paper-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Run focused tests
        run: pytest tests/test_daily_monitor.py tests/test_performance_analytics.py tests/test_drawdown_diagnostics.py
      - name: Generate daily paper report
        id: monitor
        shell: bash
        run: |
          MODE_ARGS=()
          if [ '${{ github.event_name }}' = 'schedule' ] || [ '${{ inputs.mode }}' = 'simulate' ]; then
            MODE_ARGS+=(--execute-simulation)
          fi
          python -m investment_audit.daily_monitor --root . "${MODE_ARGS[@]}" | tee monitor-result.json
          python -m investment_audit.performance_analytics --root . | tee performance-result.json
          python -m investment_audit.drawdown_diagnostics --root . | tee diagnostics-result.json
      - name: Validate sanitized output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('web/data/paper-trading/latest-report.json').read_text(encoding='utf-8'))
          metrics = json.loads(Path('web/data/paper-trading/performance-metrics.json').read_text(encoding='utf-8'))
          diagnostics = json.loads(Path('web/data/paper-trading/drawdown-diagnostics.json').read_text(encoding='utf-8'))
          assert report['paper_only'] is True
          assert metrics['paper_only'] is True
          assert diagnostics['paper_only'] is True
          assert diagnostics['stability_plan']['observations'] >= 0
          text = ''.join(Path(path).read_text(encoding='utf-8') for path in [
              'web/data/paper-trading/latest-report.json',
              'web/data/paper-trading/performance-metrics.json',
              'web/data/paper-trading/drawdown-diagnostics.json',
          ]).lower()
          assert 'api_key' not in text and 'authorization' not in text
          PY
      - name: Commit changed reports
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/paper-trading
          if git diff --cached --quiet; then
            echo 'No report changes.'
            exit 0
          fi
          git commit -m 'data: update daily paper portfolio report'
          git pull --rebase origin main
          git push origin main
      - name: Write workflow summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('web/data/paper-trading/latest-report.json').read_text(encoding='utf-8')) if Path('web/data/paper-trading/latest-report.json').exists() else {}
          metrics = json.loads(Path('web/data/paper-trading/performance-metrics.json').read_text(encoding='utf-8')) if Path('web/data/paper-trading/performance-metrics.json').exists() else {}
          diagnostics = json.loads(Path('web/data/paper-trading/drawdown-diagnostics.json').read_text(encoding='utf-8')) if Path('web/data/paper-trading/drawdown-diagnostics.json').exists() else {}
          print('## Daily paper portfolio monitor')
          if report:
              summary = report['summary']
              print(f"- Tokyo date: {report['trading_date']}")
              print(f"- Equity: ¥{summary['equity']:,.0f}")
              print(f"- Total P/L: ¥{summary['total_pnl']:,.0f}")
          if metrics:
              print(f"- Analytics observations: {metrics['sample']['observations']}")
          if diagnostics:
              print(f"- Diagnosed causes: {len(diagnostics['causes'])}")
              print(f"- Stability status: {diagnostics['stability_plan']['status']}")
          print('- Real broker orders: never sent')
          PY
