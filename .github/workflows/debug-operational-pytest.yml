name: Temporary operational pytest diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Capture pytest
        shell: bash
        run: |
          set +e
          pytest -q > operational-pytest-output.txt 2>&1
          code=$?
          set -e
          echo "pytest_exit_code=$code" >> operational-pytest-output.txt
      - name: Commit unique diagnostic
        shell: bash
        run: |
          mkdir -p debug
          target="debug/operational-pytest-output-${GITHUB_RUN_ID}.txt"
          mv operational-pytest-output.txt "$target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "debug: operational pytest output ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main
          git push origin main
