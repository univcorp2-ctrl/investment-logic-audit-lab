name: Temporary performance test diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Capture web tests
        shell: bash
        run: |
          cd web
          npm ci
          set +e
          npm test > ../performance-test-diagnostic.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> ../performance-test-diagnostic.txt
      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          mkdir -p debug
          mv performance-test-diagnostic.txt debug/performance-test-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/performance-test-diagnostic.txt
          git commit -m 'debug: capture performance test output [skip ci]'
          git push
