name: One-time J-Quants refresh
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jquants-one-time-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install application
        run: pip install -e '.[jquants]'
      - name: Load only the user-authorized J-Quants key and mask it
        env:
          SHEET_ID: 1q_k5JhznTsOpBHoUFsEivfKVFIUgLkUP
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import html
          import io
          import os
          import re
          import urllib.request
          from openpyxl import load_workbook

          file_id = os.environ['SHEET_ID']
          urls = [
              f'https://drive.google.com/uc?export=download&id={file_id}',
              f'https://docs.google.com/spreadsheets/d/{file_id}/export?format=xlsx',
              f'https://docs.google.com/spreadsheets/d/{file_id}/export?format=csv',
              f'https://docs.google.com/spreadsheets/d/{file_id}/gviz/tq?tqx=out:csv',
              f'https://docs.google.com/spreadsheets/d/{file_id}/edit?usp=drivesdk',
          ]

          def is_target(value):
              return 'jquants' in re.sub(r'[^a-z0-9]', '', str(value).lower())

          def valid_key(value):
              text = str(value or '').strip()
              return text if re.fullmatch(r'[A-Za-z0-9_.~+/=-]{20,200}', text) else ''

          def from_xlsx(data):
              workbook = load_workbook(io.BytesIO(data), read_only=True, data_only=True)
              for sheet in workbook.worksheets:
                  for row in sheet.iter_rows(values_only=True):
                      values = list(row)
                      if any(is_target(cell) for cell in values):
                          for cell in values[1:]:
                              candidate = valid_key(cell)
                              if candidate:
                                  return candidate
              return ''

          def from_text(text):
              for row in csv.reader(io.StringIO(text)):
                  if any(is_target(cell) for cell in row):
                      for cell in row[1:]:
                          candidate = valid_key(cell)
                          if candidate:
                              return candidate
              plain = html.unescape(text)
              marker = re.search(r'j\s*[-_]?\s*quants', plain, flags=re.I)
              if marker:
                  window = plain[marker.start():marker.start() + 4000]
                  for candidate in re.findall(r'[A-Za-z0-9_.~+/=-]{30,200}', window):
                      checked = valid_key(candidate)
                      if checked and 'jquants' not in checked.lower():
                          return checked
              return ''

          key = ''
          failures = []
          for url in urls:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read()
                  key = from_xlsx(data) if data.startswith(b'PK\x03\x04') else from_text(data.decode('utf-8-sig', errors='replace'))
                  if key:
                      break
                  failures.append('no matching row')
              except Exception as exc:
                  failures.append(type(exc).__name__)
          if not key:
              raise SystemExit('The authorized J-Quants row could not be read. Attempts: ' + ', '.join(failures))
          print(f'::add-mask::{key}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f'JQUANTS_API_KEY={key}\n')
          PY
      - name: Validate API connection
        run: investment-audit jquants-plan-check --plan free --as-of 2026-08-03 --out-dir outputs/jquants
      - name: Run staged screen and create redacted status
        id: screen
        shell: bash
        run: |
          set +e
          python -m investment_audit.jquants_free_screen \
            --as-of 2026-08-03 \
            --market '' \
            --universe-size 15 \
            --top-n 15 \
            --requests-per-minute 5 \
            --history-years 2 \
            --min-average-daily-value 100000000 \
            --out-dir outputs/jquants \
            > /tmp/jquants.stdout 2> /tmp/jquants.stderr
          code=$?
          export SCREEN_EXIT_CODE="$code"
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          from pathlib import Path

          secret = os.environ.get('JQUANTS_API_KEY', '')
          stdout = Path('/tmp/jquants.stdout').read_text(encoding='utf-8', errors='replace')[-6000:]
          stderr = Path('/tmp/jquants.stderr').read_text(encoding='utf-8', errors='replace')[-6000:]
          def clean(text):
              if secret:
                  text = text.replace(secret, '[REDACTED]')
              text = re.sub(r'(?i)(x-api-key|authorization)\s*[:=]\s*\S+', r'\1=[REDACTED]', text)
              text = re.sub(r'[A-Za-z0-9_.~+/=-]{48,}', '[REDACTED-LONG-TOKEN]', text)
              return text
          status = {
              'generated_at': dt.datetime.now(dt.timezone.utc).isoformat(),
              'status': 'success' if os.environ['SCREEN_EXIT_CODE'] == '0' else 'failure',
              'exit_code': int(os.environ['SCREEN_EXIT_CODE']),
              'mode': 'free-staged-liquid-universe',
              'stdout_tail': clean(stdout),
              'stderr_tail': clean(stderr),
          }
          Path('web/jquants-run-status.json').write_text(json.dumps(status, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Publish sanitized ranking or diagnostic status
        shell: bash
        run: |
          if [ '${{ steps.screen.outputs.exit_code }}' = '0' ]; then
            cp outputs/jquants/ranking.json web/jquants-ranking.json
            cp outputs/jquants/ranking.csv web/jquants-ranking.csv
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/jquants-run-status.json
          if [ '${{ steps.screen.outputs.exit_code }}' = '0' ]; then
            git add web/jquants-ranking.json web/jquants-ranking.csv
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'data: publish J-Quants run result [skip ci]'
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jquants-screen-${{ github.run_id }}
          path: |
            outputs/jquants
            web/jquants-run-status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail when screening failed
        if: steps.screen.outputs.exit_code != '0'
        run: exit 1
