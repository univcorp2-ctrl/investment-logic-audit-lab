name: Security detail refresh

on:
  schedule:
    - cron: '30 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-detail-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: |
          pip install -e '.[dev]'
          pip install jquants-api-client
      - name: Focused tests
        run: pytest tests/test_security_detail_builder.py
      - name: Build security details
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python -m investment_audit.security_detail_builder --root . --max-codes 10
      - name: Validate sanitized outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index = json.loads(Path('web/data/security-details/index.json').read_text())
          assert index['paper_only'] is True
          assert index['securities']
          for row in index['securities']:
              path = Path('web/data/security-details') / f"{row['code']}.json"
              data = json.loads(path.read_text())
              assert data['paper_only'] is True
              assert 'api_key' not in path.read_text().lower()
              assert data['recommendation']['fundamental'] is not data['recommendation']['technical']
          PY
      - name: Commit data
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/security-details
          if git diff --cached --quiet; then
            echo 'No security-detail changes.'
            exit 0
          fi
          git commit -m 'data: refresh security detail cards'
          git pull --rebase origin main
          git push origin main
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('web/data/security-details/index.json')
          print('## Security details')
          if not path.exists():
              print('- No output generated')
          else:
              data = json.loads(path.read_text())
              print(f"- Securities: {len(data['securities'])}")
              print('- Financials: J-Quants when available')
              print('- News: headline/link only')
              print('- Real orders: never sent')
          PY
