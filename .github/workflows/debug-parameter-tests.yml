name: Temporary parameter test diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Capture lint and unit tests
        shell: bash
        run: |
          cd web
          npm ci
          set +e
          npm run lint > ../parameter-test-output.txt 2>&1
          lint_code=$?
          npm test >> ../parameter-test-output.txt 2>&1
          test_code=$?
          set -e
          echo "lint_exit_code=$lint_code" >> ../parameter-test-output.txt
          echo "test_exit_code=$test_code" >> ../parameter-test-output.txt
      - name: Commit output
        shell: bash
        run: |
          mkdir -p debug
          mv parameter-test-output.txt debug/parameter-test-output.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/parameter-test-output.txt
          git commit -m 'debug: capture parameter lint output [skip ci]'
          git push
