name: Weekly sanitized stock details

on:
  schedule:
    - cron: '0 2 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-stock-details
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Require J-Quants secret
        shell: bash
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: |
          if [ -z "$JQUANTS_API_KEY" ]; then
            echo '::error::JQUANTS_API_KEY repository secret is not configured. Existing sanitized files were preserved; no fresh financial data was downloaded.'
            exit 1
          fi
          echo 'J-Quants credential is configured.'
      - name: Install
        run: pip install -e '.[dev,jquants]'
      - name: Focused tests
        run: pytest tests/test_stock_detail_pipeline.py tests/test_stock_detail_rate_limit.py
      - name: Refresh financial summaries
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
        run: python -m investment_audit.stock_detail_pipeline --root . --plan free --limit 10 | tee stock-detail-result.json
      - name: Require actual financial rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('web/data/stock-details')
          index = json.loads((root / 'index.json').read_text(encoding='utf-8'))
          updated = int(index.get('updated', 0))
          assert updated >= 8, f'Only {updated} securities contain fresh financial summaries; refusing to publish an empty refresh.'
          assert int(index.get('api_calls', 0)) >= updated, 'Expected paced J-Quants calls were not recorded.'
          text = ''.join(path.read_text(encoding='utf-8') for path in root.glob('*.json')).lower()
          assert 'api_key' not in text and 'authorization' not in text
          PY
      - name: Commit sanitized stock details
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/stock-details
          if git diff --cached --quiet; then
            echo 'No stock-detail changes.'
            exit 0
          fi
          git commit -m 'data: refresh sanitized stock financial summaries'
          git pull --rebase origin main
          git push origin main
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('web/data/stock-details/index.json')
          print('## Sanitized stock detail refresh')
          if not path.exists():
              print('- No index generated.')
              raise SystemExit
          data = json.loads(path.read_text(encoding='utf-8'))
          print(f"- Securities: {len(data.get('securities', []))}")
          print(f"- Updated with financial rows: {data.get('updated', 0)}")
          print(f"- Preserved/empty: {data.get('preserved', 0)}")
          print(f"- Paced API calls: {data.get('api_calls', 0)}")
          print(f"- Errors: {len(data.get('errors', []))}")
          print('- Secrets committed: no')
          PY
