name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff enhanced analysis code
        run: >-
          ruff check --output-format github
          src/investment_audit/fundamentals.py
          src/investment_audit/technical.py
          src/investment_audit/screening.py
          src/investment_audit/portfolio.py
          tests/test_fundamentals.py
          tests/test_technical.py
          tests/test_screening.py
          tests/test_portfolio.py
      - name: Type check enhanced analysis code
        shell: bash
        run: |
          set +e
          mypy \
            --python-version ${{ matrix.python-version }} \
            --show-column-numbers \
            --show-error-codes \
            --no-error-summary \
            src/investment_audit/fundamentals.py \
            src/investment_audit/technical.py \
            src/investment_audit/screening.py \
            src/investment_audit/portfolio.py | tee mypy-output.txt
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
              file="${BASH_REMATCH[1]}"
              line_no="${BASH_REMATCH[2]}"
              column="${BASH_REMATCH[3]}"
              message="${BASH_REMATCH[4]}"
              echo "::error file=${file},line=${line_no},col=${column}::${message}"
            fi
          done < mypy-output.txt
          exit "$status"
      - name: Tests with coverage
        run: pytest --maxfail=20 --cov=investment_audit --cov-report=term-missing --cov-fail-under=80
      - name: Repeat tests twice for flake detection
        run: pytest && pytest
