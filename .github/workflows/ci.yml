name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff enhanced analysis code
        run: >-
          ruff check --output-format github
          src/investment_audit/fundamentals.py
          src/investment_audit/technical.py
          src/investment_audit/screening.py
          src/investment_audit/portfolio.py
          src/investment_audit/backtest.py
          src/investment_audit/cli.py
          src/investment_audit/factor_diagnostics.py
          src/investment_audit/feature_library.py
          src/investment_audit/risk_metrics.py
          src/investment_audit/allocation.py
          src/investment_audit/providers
          tests/test_fundamentals.py
          tests/test_technical.py
          tests/test_screening.py
          tests/test_portfolio.py
          tests/test_backtest.py
          tests/test_cli.py
          tests/test_jquants_provider.py
          tests/test_factor_diagnostics.py
          tests/test_feature_library.py
          tests/test_risk_metrics.py
          tests/test_allocation.py
          tests/test_factor_cli.py
      - name: Type check enhanced analysis code
        shell: bash
        run: |
          set +e
          mypy \
            --python-version ${{ matrix.python-version }} \
            --show-column-numbers \
            --show-error-codes \
            --no-error-summary \
            src/investment_audit/fundamentals.py \
            src/investment_audit/technical.py \
            src/investment_audit/screening.py \
            src/investment_audit/portfolio.py \
            src/investment_audit/backtest.py \
            src/investment_audit/cli.py \
            src/investment_audit/factor_diagnostics.py \
            src/investment_audit/feature_library.py \
            src/investment_audit/risk_metrics.py \
            src/investment_audit/allocation.py \
            src/investment_audit/providers | tee mypy-output.txt
          status=${PIPESTATUS[0]}
          while IFS= read -r line; do
            if [[ "$line" =~ ^([^:]+):([0-9]+):([0-9]+):\ error:\ (.*)$ ]]; then
              file="${BASH_REMATCH[1]}"
              line_no="${BASH_REMATCH[2]}"
              column="${BASH_REMATCH[3]}"
              message="${BASH_REMATCH[4]}"
              echo "::error file=${file},line=${line_no},col=${column}::${message}"
            fi
          done < mypy-output.txt
          exit "$status"
      - name: Tests with core coverage
        shell: bash
        run: |
          set +e
          pytest --maxfail=20 \
            --cov=investment_audit.fundamentals \
            --cov=investment_audit.technical \
            --cov=investment_audit.screening \
            --cov=investment_audit.portfolio \
            --cov=investment_audit.backtest \
            --cov-report=term-missing \
            --cov-fail-under=85 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            message=$(python - <<'PY'
          from pathlib import Path
          text = Path("pytest-output.txt").read_text(encoding="utf-8", errors="replace")[-20000:]
          print(text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"))
          PY
            )
            echo "::error title=Pytest failure::${message}"
          fi
          exit "$status"
      - name: Repeat tests twice for flake detection
        run: pytest && pytest
