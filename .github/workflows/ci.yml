name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff enhanced analysis code
        run: >-
          ruff check --output-format github
          src/investment_audit/fundamentals.py
          src/investment_audit/technical.py
          src/investment_audit/screening.py
          src/investment_audit/portfolio.py
          tests/test_fundamentals.py
          tests/test_technical.py
          tests/test_screening.py
          tests/test_portfolio.py
      - name: Type check enhanced analysis code
        run: >-
          mypy
          src/investment_audit/fundamentals.py
          src/investment_audit/technical.py
          src/investment_audit/screening.py
          src/investment_audit/portfolio.py
      - name: Tests with coverage
        run: pytest --cov=investment_audit --cov-report=term-missing --cov-fail-under=80
      - name: Repeat tests twice for flake detection
        run: pytest && pytest
