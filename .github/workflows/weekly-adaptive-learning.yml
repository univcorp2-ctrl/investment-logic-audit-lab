name: Weekly guarded adaptive strategy

on:
  schedule:
    - cron: '30 2 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-adaptive-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install learner
        run: pip install -e '.[dev,ml]'
      - name: Guardrail tests
        run: pytest tests/test_adaptive_strategy.py tests/test_adaptive_guard.py
      - name: Compare profiles and apply guarded paper policy
        run: |
          python -m investment_audit.adaptive_strategy --root . | tee adaptive-strategy-result.json
          python -m investment_audit.adaptive_guard --root . | tee adaptive-guard-result.json
      - name: Validate paper-only outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('web/data/adaptive-strategy')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          active = json.loads((root / 'active-policy.json').read_text(encoding='utf-8'))
          guard = json.loads((root / 'guard-state.json').read_text(encoding='utf-8'))
          assert active['paper_only'] is True
          assert guard['paper_only'] is True
          assert active.get('status') in {'active', 'collecting_data'}
          text = ''.join(path.read_text(encoding='utf-8') for path in root.glob('*.json')).lower()
          assert 'api_key' not in text and 'authorization' not in text
          if guard.get('rollback'):
              assert status.get('rolled_back_now') is True
          PY
      - name: Commit sanitized strategy state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/adaptive-strategy
          if git diff --cached --quiet; then
            echo 'No adaptive-strategy changes.'
            exit 0
          fi
          git commit -m 'data: update guarded adaptive paper strategy'
          git pull --rebase origin main
          git push origin main
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          root = Path('web/data/adaptive-strategy')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8')) if (root / 'status.json').exists() else {}
          guard = json.loads((root / 'guard-state.json').read_text(encoding='utf-8')) if (root / 'guard-state.json').exists() else {}
          print('## Guarded adaptive paper strategy')
          print(f"- Status: {status.get('status', 'not_run')}")
          print(f"- Observations: {status.get('observations', 0)} / {status.get('required_observations', 63)}")
          print(f"- Walk-forward windows: {status.get('walk_forward_windows', 0)} / {status.get('required_windows', 3)}")
          print(f"- Promoted now: {status.get('promoted_now', False)}")
          print(f"- Relative guard: {guard.get('status', 'not_monitoring')}")
          print(f"- Relative rollback: {guard.get('rollback', False)}")
          print('- Scope: paper/demo only; no broker order is sent')
          PY
