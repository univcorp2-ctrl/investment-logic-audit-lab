name: Temporary canonical E2E diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Prepare E2E
        working-directory: web
        run: |
          npm ci
          npm run build
          npm install --no-save --package-lock=false @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Capture canonical E2E
        shell: bash
        run: |
          cd web
          set +e
          npm run e2e > ../canonical-e2e-output.txt 2>&1
          code=$?
          set -e
          echo "exit_code=$code" >> ../canonical-e2e-output.txt
      - name: Commit diagnostic
        shell: bash
        run: |
          mkdir -p debug
          mv canonical-e2e-output.txt debug/canonical-e2e-output.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/canonical-e2e-output.txt
          git commit -m 'debug: capture canonical E2E output [skip ci]'
          git pull --rebase origin main
          git push origin main
