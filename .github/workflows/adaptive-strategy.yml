name: Guarded adaptive paper strategy

on:
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-paper-strategy
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test operational adaptive guardrails
        run: |
          pytest \
            tests/test_adaptive_strategy.py \
            tests/test_adaptive_guard.py \
            tests/test_adaptive_operational_guard.py \
            tests/test_operational_strategy_evaluation.py
      - name: Refresh operational evaluation
        run: |
          python -m investment_audit.operational_strategy_evaluation --root . \
            | tee operational-strategy-result.json
      - name: Evaluate research candidates
        run: |
          python -m investment_audit.adaptive_strategy --root . \
            | tee adaptive-candidate-result.json
      - name: Apply operational-only safety gate
        run: |
          python -m investment_audit.adaptive_operational_guard --root . \
            | tee adaptive-operational-result.json
      - name: Validate sanitized paper-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('web/data/adaptive-strategy')
          status = json.loads((root / 'status.json').read_text(encoding='utf-8'))
          policy = json.loads((root / 'active-policy.json').read_text(encoding='utf-8'))
          operational = json.loads(
              Path('web/data/strategy-lab/operational.json').read_text(encoding='utf-8')
          )
          assert status['paper_only'] is True
          assert status['real_order_allowed'] is False
          assert operational['paper_only'] is True
          assert operational['lookahead_safe'] is True
          assert policy.get('paper_only') is True
          assert policy.get('real_order_allowed') is False
          if policy.get('status') == 'active':
              assert policy.get('guardrails_passed') is True
              assert policy.get('operational_data_verified') is True
              assert status.get('operational_data_verified') is True
              assert status.get('operational_observations', 0) >= 169
              assert status.get('oos_observations', 0) >= 42
          else:
              assert policy.get('operational_data_verified') is not True
          text = ''.join(path.read_text(encoding='utf-8') for path in root.glob('*.json')).lower()
          assert 'api_key' not in text and 'authorization' not in text
          assert 'real_order_allowed": true' not in text
          PY
      - name: Commit adaptive research state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/adaptive-strategy web/data/strategy-lab/operational.json
          if git diff --cached --quiet; then
            echo 'No adaptive state changes.'
            exit 0
          fi
          git commit -m 'data: update operationally verified adaptive paper strategy'
          git pull --rebase origin main
          git push origin main
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path('web/data/adaptive-strategy/status.json')
          print('## Guarded adaptive paper strategy')
          if not path.exists():
              print('- No status generated')
              raise SystemExit
          data = json.loads(path.read_text(encoding='utf-8'))
          print(f"- Status: {data.get('status')}")
          print(f"- Operational observations: {data.get('operational_observations', 0)} / {data.get('required_operational_observations', 169)}")
          print(f"- OOS observations: {data.get('oos_observations', 0)} / {data.get('required_oos_observations', 42)}")
          print(f"- Paper observations: {data.get('paper_observations', 0)}")
          print(f"- Walk-forward windows: {data.get('walk_forward_windows', 0)}")
          print(f"- Operational data verified: {data.get('operational_data_verified', False)}")
          print(f"- Promoted now: {data.get('promoted_now', False)}")
          print('- Counterfactual results: never auto-applied')
          print('- Broker orders: never sent')
          PY
