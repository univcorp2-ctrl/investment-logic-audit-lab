name: Guarded adaptive paper strategy

on:
  schedule:
    - cron: '30 1 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: adaptive-paper-strategy
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Test adaptive guardrails
        run: pytest tests/test_adaptive_strategy.py
      - name: Evaluate challenger policies
        run: python -m investment_audit.adaptive_strategy --root . | tee adaptive-result.json
      - name: Validate sanitized paper-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('web/data/adaptive-strategy')
          status=json.loads((root/'status.json').read_text(encoding='utf-8'))
          policy=json.loads((root/'active-policy.json').read_text(encoding='utf-8'))
          assert status['paper_only'] is True
          assert status['status'] in {'collecting_data','challenger_testing','active','rolled_back'}
          assert status['required_observations'] >= 63
          assert status['required_windows'] >= 3
          assert policy.get('paper_only') is True
          text=''.join(path.read_text(encoding='utf-8') for path in root.glob('*.json')).lower()
          assert 'api_key' not in text and 'authorization' not in text
          if policy.get('status') == 'active':
              assert policy.get('guardrails_passed') is True
          PY
      - name: Commit adaptive research state
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/adaptive-strategy
          if git diff --cached --quiet; then
            echo 'No adaptive state changes.'
            exit 0
          fi
          git commit -m 'data: update guarded adaptive paper strategy'
          git pull --rebase origin main
          git push origin main
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path=Path('web/data/adaptive-strategy/status.json')
          if not path.exists():
              print('## Adaptive paper strategy\nNo status generated.')
              raise SystemExit
          data=json.loads(path.read_text(encoding='utf-8'))
          print('## Guarded adaptive paper strategy')
          print(f"- Status: {data['status']}")
          print(f"- OOS observations: {data['observations']} / {data['required_observations']}")
          print(f"- Walk-forward windows: {data['walk_forward_windows']} / {data['required_windows']}")
          print(f"- Fundamental locked: {data['fundamental_locked']}")
          print(f"- Champion: {data['champion']['name']}")
          print(f"- Challenger: {data['challenger']['name']}")
          print(f"- Promoted now: {data['promoted_now']}")
          print('- Broker orders: never sent')
          PY
