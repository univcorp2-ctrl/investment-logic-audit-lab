name: Temporary adaptive build diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Capture production build output
        shell: bash
        run: |
          cd web
          npm ci
          set +e
          npm run build > ../adaptive-build-diagnostic.txt 2>&1
          code=$?
          set -e
          printf '\nexit_code=%s\n' "$code" >> ../adaptive-build-diagnostic.txt
      - name: Publish sanitized diagnostic
        shell: bash
        run: |
          mkdir -p debug
          mv adaptive-build-diagnostic.txt debug/adaptive-build-diagnostic.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add debug/adaptive-build-diagnostic.txt
          git commit -m 'debug: capture adaptive build output [skip ci]'
          git push
