name: Temporary parameter E2E diagnostic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and run E2E
        shell: bash
        run: |
          cd web
          npm ci
          npm run build
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install --with-deps chromium
          set +e
          npm run e2e > ../parameter-e2e-output.txt 2>&1
          code=$?
          set -e
          echo "e2e_exit_code=$code" >> ../parameter-e2e-output.txt
      - name: Commit unique diagnostic output
        shell: bash
        run: |
          mkdir -p debug
          target="debug/parameter-e2e-output-${GITHUB_RUN_ID}.txt"
          mv parameter-e2e-output.txt "$target"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$target"
          git commit -m "debug: parameter E2E output ${GITHUB_RUN_ID} [skip ci]"
          git pull --rebase origin main
          git push origin main
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parameter-e2e-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: warn
          retention-days: 2
