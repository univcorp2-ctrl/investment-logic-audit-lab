name: Weekly open-source strategy lab

on:
  schedule:
    - cron: '30 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-strategy-lab
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research extras
        run: pip install -e '.[dev,quantlab]'
      - name: Run focused tests
        run: pytest tests/test_open_source_strategy_lab.py
      - name: Run research comparison
        run: python -m investment_audit.open_source_strategy_lab --root . | tee strategy-lab-result.json
      - name: Validate research-only output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('web/data/strategy-lab/latest.json').read_text(encoding='utf-8'))
          assert payload['purpose'] == 'research_only'
          assert payload['auto_adopt'] is False
          assert 'api_key' not in json.dumps(payload).lower()
          PY
      - name: Commit sanitized research report
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/strategy-lab
          if git diff --cached --quiet; then
            echo 'No strategy-lab changes.'
            exit 0
          fi
          git commit -m 'data: update weekly strategy research lab'
          git pull --rebase origin main
          git push origin main
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path('web/data/strategy-lab/latest.json')
          if not path.exists():
              print('## Strategy lab\nNo report generated.')
              raise SystemExit
          data = json.loads(path.read_text(encoding='utf-8'))
          print('## Open-source strategy lab')
          print(f"- Observations: {data['observations']}")
          print(f"- Walk-forward: {data['walk_forward']['status']}")
          print(f"- Adoption status: {data['adoption_status']}")
          print('- Auto adoption: disabled')
          for warning in data['warnings']:
              print(f"- Warning: {warning}")
          PY
