name: Weekly open-source strategy lab

on:
  schedule:
    - cron: '30 0 * * 6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-strategy-lab
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install research extras
        run: pip install -e '.[dev,quantlab]'
      - name: Run focused tests
        run: |
          pytest \
            tests/test_open_source_strategy_lab.py \
            tests/test_strategy_lab_availability.py \
            tests/test_operational_strategy_evaluation.py
      - name: Run counterfactual and operational research
        run: |
          python -m investment_audit.open_source_strategy_lab --root . | tee strategy-lab-result.json
          python -m investment_audit.strategy_lab_availability --root . | tee strategy-availability-result.json
          python -m investment_audit.operational_strategy_evaluation --root . | tee operational-strategy-result.json
      - name: Validate research-only outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          counterfactual = json.loads(
              Path('web/data/strategy-lab/latest.json').read_text(encoding='utf-8')
          )
          operational = json.loads(
              Path('web/data/strategy-lab/operational.json').read_text(encoding='utf-8')
          )
          assert counterfactual['purpose'] == 'research_only'
          assert counterfactual['auto_adopt'] is False
          assert operational['paper_only'] is True
          assert operational['lookahead_safe'] is True
          assert operational['observations'] >= 0
          if operational['evaluation_start']:
              assert operational['operational_start'] <= operational['evaluation_start']
          text = json.dumps(
              {'counterfactual': counterfactual, 'operational': operational}
          ).lower()
          assert 'api_key' not in text and 'authorization' not in text
          PY
      - name: Commit sanitized research reports
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/data/strategy-lab
          if git diff --cached --quiet; then
            echo 'No strategy-lab changes.'
            exit 0
          fi
          git commit -m 'data: update counterfactual and operational strategy research'
          git pull --rebase origin main
          git push origin main
      - name: Summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          counterfactual_path = Path('web/data/strategy-lab/latest.json')
          operational_path = Path('web/data/strategy-lab/operational.json')
          print('## Open-source strategy lab')
          if counterfactual_path.exists():
              data = json.loads(counterfactual_path.read_text(encoding='utf-8'))
              availability = data.get('availability_model', {})
              print(f"- Counterfactual observations: {availability.get('counterfactual_observations', data.get('observations', 0))}")
              print('- Counterfactual auto adoption: disabled')
          if operational_path.exists():
              operational = json.loads(operational_path.read_text(encoding='utf-8'))
              print(f"- Operational observations: {operational.get('observations', 0)}")
              print(f"- Operational walk-forward: {operational.get('walk_forward', {}).get('status', 'unavailable')}")
              print(f"- Look-ahead safe: {operational.get('lookahead_safe', False)}")
          PY
